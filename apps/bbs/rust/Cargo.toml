[package]
name = "herkules-bbs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
herkules-feishu = { path = "../../../packages/feishu-rust" }
uuid = { version = "1", features = ["v4"] }
herkules-auth = { path = "../../../packages/auth-rust" }
base64 = "0.22"
askama = "0.16.1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "chrono",
  "json",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rmcp = { version = "3.5.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }

tower = { version = "0.5", features = ["util"] }

ammonia = "4.2"
scraper = "0.26"
ego-tree = "0.11"
pulldown-cmark = "0.13"
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "stream",
  "gzip",
] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
prost = "0.13"
larksuite-oapi-sdk-rs = { version = "=0.3.12", features = ["ws"] }
flate2 = "1"
