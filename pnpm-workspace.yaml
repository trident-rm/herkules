packages:
  - apps/*
  - packages/*
  - services/*
  - tools/*

catalogMode: prefer

catalog:
  "@electric-sql/pglite": ^0.5.8
  "@hono/node-server": ^2.1.1
  "@hono/zod-validator": ^0.9.0
  "@modelcontextprotocol/client": 2.0.0
  "@modelcontextprotocol/server": 2.0.0
  "@tanstack/react-query": ^5.102.6
  "@tanstack/react-router": ^1.170.32
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.0
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  hono: ^4.13.5
  jose: ^6.0.0
  postgres: ^3.4.9
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  zod: ^4.6.2
  radix-ui: ^1.6.7
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  lucide-react: ^1.35.0
  "@larksuiteoapi/node-sdk": 1.73.0
  ws: ^8.21.3
  "@types/ws": ^8.18.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# pnpm 11 (strictDepBuilds): every dependency with a build script must be listed here or `vp install` fails.
allowBuilds:
  esbuild: true
  workerd: true
  protobufjs: true
  keytar: false
minimumReleaseAgeExclude:
  - lucide-react@1.35.0
