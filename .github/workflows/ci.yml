name: CI
on:
  pull_request:
  workflow_dispatch:
    inputs:
      parity:
        description: Run the legacy BBS comparisons with Postgres
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    if: "!inputs.parity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      javascript: ${{ steps.select.outputs.javascript }}
      rust: ${{ steps.select.outputs.rust }}
      previous-images: ${{ steps.select.outputs.previous-images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$PR_BASE
          previous='{}'
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A failed or skipped build has no application artifact. Diff against a
            # published ancestor so its pending changes are included in the retry.
            candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=application&per_page=100" \
              --jq '.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main") | [.workflow_run.id, .workflow_run.head_sha] | @tsv')
            while IFS=$'\t' read -r run sha; do
              if [[ -z "$run" || "$sha" == "$GITHUB_SHA" ]] || ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA" 2>/dev/null; then
                continue
              fi
              if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" |
                jq -e '.path == ".github/workflows/ci.yml" and .conclusion == "success"
                  and (.event == "push" or .event == "workflow_dispatch")' >/dev/null; then
                continue
              fi
              if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name application --dir "$RUNNER_TEMP/baseline" &&
                previous=$(jq -ce --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" \
                  'select(.schemaVersion == 1 and .repository == $repo and .sourceSha == $sha
                    and (.images | keys) == ["ai","auth","bbs","bbs-web","platform"]) | .images' \
                  "$RUNNER_TEMP/baseline/application.json"); then
                base=$sha
              else
                previous='{}'
              fi
              break
            done <<< "$candidates"
          fi

          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base=$base" >> "$GITHUB_OUTPUT"
            selection=$(git diff --no-renames --name-only -z "$base" "$GITHUB_SHA" | node tools/images/image-targets.mjs)
          else
            base=''
            selection=$(node tools/images/image-targets.mjs --all)
          fi
          if [[ -z "$base" ]] || ! git diff --quiet "$base" "$GITHUB_SHA" -- \
            .github/workflows/ci.yml tools/images/image-targets.mjs tools/images/image-targets.test.mjs; then
            node --test tools/images/*.test.mjs
          fi
          {
            echo "targets=$(jq -c '.targets' <<< "$selection")"
            echo "javascript=$(jq -c '.javascript' <<< "$selection")"
            echo "rust=$(jq -r '.rust | join(" ")' <<< "$selection")"
            echo "previous-images=$previous"
          } >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan introduced commits with redacted output
        env:
          BASE: ${{ steps.select.outputs.base }}
        run: |
          revisions="$GITHUB_SHA"
          if [[ -n "$BASE" ]]; then
            revisions="$BASE..$GITHUB_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--diff-merges=first-parent $revisions"

  images:
    needs: [changes, ready, rust]
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      (needs.ready.result == 'success' || needs.ready.result == 'skipped') &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      needs.changes.outputs.targets != '[]' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' && !inputs.parity
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/image-build.yml
    with:
      targets: ${{ needs.changes.outputs.targets }}
      previous-images: ${{ needs.changes.outputs.previous-images }}

  ready:
    needs: changes
    if: needs.changes.outputs.javascript != '[]' && !inputs.parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Install the locked package manager
        id: pnpm
        run: |
          npm install --global "pnpm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
          echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - name: Resolve affected JavaScript workspaces
        id: workspaces
        env:
          FILTERS: ${{ needs.changes.outputs.javascript }}
        run: |
          if [[ "$FILTERS" == '["."]' ]]; then
            affected=$(pnpm -r list --depth -1 --json)
          else
            filters=()
            while IFS= read -r filter; do filters+=(--filter "$filter"); done < <(jq -r '.[]' <<< "$FILTERS")
            affected=$(pnpm "${filters[@]}" list --depth -1 --json)
          fi
          affected=$(jq -c --arg root "$PWD" \
            '[.[] | select(.path != $root) | {name, path: (.path | ltrimstr($root + "/"))}]' <<< "$affected")
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        if: contains(steps.workspaces.outputs.affected, '"@herkules/ai"') || contains(steps.workspaces.outputs.affected, '"@herkules/bbs"')
        with:
          install-only: true
          cache: false
          prek-version: "0.5.11"
      - name: Build, check and test affected workspaces
        env:
          AFFECTED: ${{ steps.workspaces.outputs.affected }}
          FULL: ${{ needs.changes.outputs.javascript == '["."]' }}
        run: |
          build=()
          paths=()
          tests=()
          hooks=()
          while IFS=$'\t' read -r name path; do
            build+=(--filter "$name...")
            case "$name" in
              @herkules/ai|@herkules/bbs)
                if [[ "$FULL" != true ]]; then
                  hooks+=("$path:check-js")
                fi
                hooks+=("$path:test-js")
                ;;
              *)
                paths+=("$path")
                tests+=(--filter "$name")
                ;;
            esac
          done < <(jq -r '.[] | [.name, .path] | @tsv' <<< "$AFFECTED")

          # Build each dependency once before invoking the component hooks.
          if [[ "$FULL" == true ]]; then
            pnpm exec vp run -r build
            pnpm exec vp check
          elif (( ${#build[@]} )); then
            pnpm exec vp run "${build[@]}" build
            if (( ${#paths[@]} )); then
              pnpm exec vp check "${paths[@]}"
            fi
          fi
          if (( ${#hooks[@]} )); then
            prek run --all-files --hook-stage manual --verbose "${hooks[@]}"
          fi
          if (( ${#tests[@]} )); then
            pnpm exec vp run "${tests[@]}" test
          fi

  rust:
    needs: changes
    if: needs.changes.outputs.rust != '' && !inputs.parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: contains(needs.changes.outputs.rust, 'herkules-bbs') || contains(needs.changes.outputs.rust, 'herkules-feishu')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        if: needs.changes.outputs.rust == 'herkules-ai' || needs.changes.outputs.rust == 'herkules-bbs'
        with:
          install-only: true
          cache: false
          prek-version: "0.5.11"
      - name: Format, lint and test affected packages
        env:
          PACKAGES: ${{ needs.changes.outputs.rust }}
        run: |
          case "$PACKAGES" in
            herkules-ai) prek run --all-files --hook-stage manual --verbose services/ai:rust ;;
            herkules-bbs) prek run --all-files --hook-stage manual --verbose apps/bbs:rust ;;
            *)
              # Check shared changes in one Cargo graph to reuse dependency builds.
              args=()
              for package in $PACKAGES; do args+=(-p "$package"); done
              cargo fmt "${args[@]}" --check
              cargo clippy --all-targets --locked "${args[@]}" -- -D warnings
              cargo test --locked "${args[@]}"
              ;;
          esac

  bbs-rust:
    if: github.event_name == 'workflow_dispatch' && inputs.parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bbs_test
          POSTGRES_PASSWORD: parity_test
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bbs_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Install the locked workspace toolchain
        run: |
          npm install --global "pnpm@$(node -p 'require("./package.json").devEngines.packageManager.version')"
          pnpm install --frozen-lockfile
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Compare Rust and TypeScript corpus reads
        env:
          BBS_RUST_TEST_POSTGRES: postgres://bbs_test:parity_test@127.0.0.1:5432/postgres
        run: pnpm exec vp run @herkules/bbs#test:rust:parity
      - name: Compare Rust and TypeScript crawler writes
        env:
          BBS_RUST_TEST_POSTGRES: postgres://bbs_test:parity_test@127.0.0.1:5432/postgres
        run: pnpm exec vp run "@herkules/bbs#test:rust:crawler"

      - name: Compare Rust and TypeScript bot behavior
        env:
          BBS_RUST_TEST_POSTGRES: postgres://bbs_test:parity_test@127.0.0.1:5432/postgres
        run: pnpm exec vp run test:rust:bot
