name: Image build
on:
  workflow_call:
    inputs:
      targets:
        required: true
        type: string
      previous-images:
        required: true
        type: string
permissions:
  contents: read
env:
  BUILD_SHA: ${{ github.sha }}
jobs:
  build:
    permissions:
      actions: read
      contents: read
      packages: write
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - id: rev
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "bake=$(jq -r 'join(",")' <<<"$TARGETS")" >> "$GITHUB_OUTPUT"
      - name: Verify application route fragments
        if: contains(fromJSON(inputs.targets), 'platform')
        run: sh tools/images/caddy.test.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only; tags come from tools/images/docker-bake.hcl.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
      # One job, one graph: the selected targets share the build stages.
      - id: bake
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        env:
          REPOSITORY: ${{ github.repository }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
        with:
          source: .
          files: |
            tools/images/docker-bake.hcl
            ${{ steps.meta.outputs.bake-file-labels }}
          targets: ${{ steps.rev.outputs.bake }}
          push: true
      - name: Record immutable image references
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          SHORT_SHA: ${{ steps.rev.outputs.short }}
          TARGETS: ${{ inputs.targets }}
        run: |
          mkdir -p image-update
          for target in $(jq -r '.[]' <<<"$TARGETS"); do
            digest=$(jq -r --arg target "$target" '.[$target]["containerimage.digest"] // ""' <<<"$METADATA")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "bake reported no digest for $target" >&2
              exit 1
            fi
            jq -n \
              --arg target "$target" \
              --arg image "ghcr.io/$GITHUB_REPOSITORY/$target:sha-$SHORT_SHA@$digest" \
              '{target: $target, image: $image}' > "image-update/$target.json"
          done
      - name: Verify the published BBS runtime and schema preparation together
        if: contains(fromJSON(inputs.targets), 'bbs-web')
        run: |
          BBS_JOBS_TEST_IMAGE=$(jq -r '.image' image-update/bbs.json)
          BBS_WEB_TEST_IMAGE=$(jq -r '.image' image-update/bbs-web.json)
          export BBS_JOBS_TEST_IMAGE BBS_WEB_TEST_IMAGE
          docker pull "$BBS_JOBS_TEST_IMAGE"
          docker pull "$BBS_WEB_TEST_IMAGE"
          sh tools/images/bbs-web.test.sh
      - name: Update convenience tags for verified images
        run: |
          for update in image-update/*.json; do
            target=$(jq -r '.target' "$update")
            image=$(jq -r '.image' "$update")
            docker buildx imagetools create --prefer-index=false \
              --tag "ghcr.io/$GITHUB_REPOSITORY/$target:latest" "$image"
          done
      - name: Assemble tested application manifest
        env:
          PREVIOUS_IMAGES: ${{ inputs.previous-images }}
        run: |
          jq -s --arg source "$BUILD_SHA" --arg repository "$GITHUB_REPOSITORY" \
            --argjson previous "$PREVIOUS_IMAGES" \
            '{schemaVersion: 1, repository: $repository, sourceSha: $source,
              images: ($previous + (map({key: .target, value: .image}) | from_entries))}
              | if (.images | keys) == ["ai","auth","bbs","bbs-web","platform"] then .
                else error("incomplete application manifest") end' \
            image-update/*.json > application.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: application
          path: application.json
          if-no-files-found: error
