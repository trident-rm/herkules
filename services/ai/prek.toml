[[repos]]
repo = "local"

[[repos.hooks]]
id = "build-js"
name = "Build the AI portal and its JavaScript dependencies"
entry = "pnpm exec vp run -t build"
language = "system"
stages = ["manual"]
pass_filenames = false
priority = 0

[[repos.hooks]]
id = "check-js"
name = "Check the AI portal JavaScript"
entry = "pnpm exec vp check"
language = "system"
stages = ["manual"]
pass_filenames = false
priority = 10

[[repos.hooks]]
id = "test-js"
name = "Test the AI portal JavaScript"
entry = "pnpm exec vp run test"
language = "system"
stages = ["manual"]
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "rust"
name = "Check and test the AI gateway Rust"
entry = "bash -ec 'cargo fmt -p herkules-ai --check && cargo clippy -p herkules-ai --all-targets --locked -- -D warnings && cargo test -p herkules-ai --locked'"
language = "system"
stages = ["manual"]
pass_filenames = false
